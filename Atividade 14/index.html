<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Principal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Formulario Principal</h1>

    <form name="pesquisa">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" minlength="10" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="comentario">Comentário:</label>
      <textarea id="comentario" name="comentario" rows="4" minlength="20" required></textarea>

      <h2>Pesquisa</h2>
      <p>É sua primeira visita?</p>

      <div class="radio-group">
        <label for="sim">
          <input type="radio" id="sim" name="visita" value="sim" required />
          Sim
        </label>

        <label for="nao">
          <input type="radio" id="nao" name="visita" value="nao" required />
          Não
        </label>
      </div>

      <button type="button" id="btn" onclick="FormPesquisa()">Enviar resposta</button>
      <button type="reset">Limpar campos</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
