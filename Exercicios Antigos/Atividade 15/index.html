<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatec Sorocaba - Cursos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Escolha um curso da Fatec Sorocaba</h1>
      <label for="curso">Cursos disponíveis:</label>
      <select id="curso" onchange="abrirCursoSelecionado()">
        <option value="">Selecione um curso</option>
        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
        <option value="gti">Gestão da Tecnologia da Informação</option>
        <option value="log">Logística</option>
        <option value="mec">Mecatrônica Industrial</option>
        <option value="pro">Engenharia de Produção</option>
      </select>
    </main>

    <script src="script.js"></script>
  </body>
</html>
